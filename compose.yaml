services:
  app:
    build: .
    image: spliit:latest
    ports:
      - 3000:3000
    env_file:
      - container.env
    # Uncomment together with UPLOADS_DIR in container.env to keep expense
    # documents on the host instead of in an S3 bucket.
    # volumes:
    #   - ./uploads:/usr/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spliit_network

  db:
    image: postgres:latest
    expose:
      - 5432
    env_file:
      - container.env
    volumes:
      - ./postgres-data:/var/lib/postgresql/
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spliit_network

networks:
  spliit_network:
    driver: bridge
